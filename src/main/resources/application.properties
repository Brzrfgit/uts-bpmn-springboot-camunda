spring.application.name=utssoal23

# Port aplikasi
server.port=8080

# Konfigurasi Database H2 (In-Memory)
spring.datasource.url=jdbc:h2:mem:camunda-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# Mengaktifkan H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Konfigurasi Camunda BPM (Akun Admin Default)
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin
camunda.bpm.admin-user.first-name=Admin
camunda.bpm.admin-user.last-name=User

# Auto-deploy file .bpmn yang ada di folder resources
camunda.bpm.auto-deployment-enabled=true

# Buat filter default "All tasks" di Tasklist
camunda.bpm.filter.create=All tasks

# Cegah error History Time To Live jika ada model BPMN tanpa TTL
camunda.bpm.generic-properties.properties.enforce-history-time-to-live=false
